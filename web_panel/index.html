<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Ultrasonic Distance Sensor</title>

    <link rel="stylesheet" href="./style.css">


</head>

<body>

    <div class="nav">
        <h1>Industrial Ultrasonic Distance Sensor</h1>
    </div>

    <div class="head">
        <div class="card-1">
            <div class="content">
                <h2>Distance</h2>
                <h3 id="distance">0</h3>
                <h4>cm</h4>
            </div>
        </div>
        <div class="card-2">
            <div class="tittle">
                <h2>Parameters</h2>
            </div>
            <form action="" id="paraForm">
                <div class="content">

                    <div class="parameter">
                        <label id="minDis">Minimum Distance (mm)</label>
                        <input type="number" class="form-control" name="minumumdistance" id="inputMinDis" value="%SLIDERVALUE%">
                    </div>
                    <div class="parameter">
                        <label id="minDis">Maximum Distance (mm)</label>
                        <input type="number" class="form-control" name="maximumdistance" id="inputMaxDis" value="%MAXDISVALUE%">
                    </div>
                    <div class="parameter">
                        <label id="minDis">Offset Distance (mm)</label>
                        <input type="number" class="form-control" name="offset" id="inputOffset" value="%OFFSETVALUE%">
                    </div>
                </div>
                <!-- button-->
                <div>

                    <button id="btn-save" type="submit">Save</button>
                    <button id="btn-reset">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                            <path fill="#ffffff"
                                d="M13.5 2c-5.621 0-10.211 4.443-10.475 10h-3.025l5 6.625 5-6.625h-2.975c.257-3.351 3.06-6 6.475-6 3.584 0 6.5 2.916 6.5 6.5s-2.916 6.5-6.5 6.5c-1.863 0-3.542-.793-4.728-2.053l-2.427 3.216c1.877 1.754 4.389 2.837 7.155 2.837 5.79 0 10.5-4.71 10.5-10.5s-4.71-10.5-10.5-10.5z" />
                        </svg>


                    </button>
                </div>
            </form>
        </div>
    </div>


    <script src="./main.js"></script>


</body>

</html>
